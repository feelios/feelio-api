plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.korit'
version = '0.0.1-SNAPSHOT'
description = 'feelio-api'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:4.0.1'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.2'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'com.mysql:mysql-connector-j'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:4.0.1'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
// Source: https://mvnrepository.com/artifact/com.openai/openai-java
    implementation("com.openai:openai-java:4.42.0")
    implementation("io.jsonwebtoken:jjwt-api:0.13.0")
    runtimeOnly("io.jsonwebtoken:jjwt-impl:0.13.0")
    runtimeOnly("io.jsonwebtoken:jjwt-jackson:0.13.0")
    implementation 'com.google.firebase:firebase-admin:9.3.0'
}

tasks.named('test') {
    useJUnitPlatform()

    // -PciOnly 를 주면 실 DB·OpenAI 가 있어야 도는 테스트를 뺀다.
    // 러너에는 MySQL 도 API 키도 없어서, 이걸 빼지 않으면 코드가 멀쩡해도 빨간불이 뜬다.
    // contextLoads(FeelioApiApplicationTests)는 DB 연결 없이 통과하므로 남겨 둔다 —
    // 빈 배선 오류를 잡는 게 이 관문의 핵심이다.
    if (project.hasProperty('ciOnly')) {
        exclude '**/AlterTableTest.class'
        exclude '**/CheckDbStateTest.class'
        exclude '**/DbMigrationTest.class'
        exclude '**/AiTest.class'
        exclude '**/TransactionMapperTest.class'
        exclude '**/SummaryMapperTest.class'
    }

    // CI 로그에 예외 타입만 찍히고 메시지가 빠져 원인 파악이 안 되던 문제를 막는다.
    // 실패했을 때 원인 체인 전체를 그대로 출력한다.
    testLogging {
        events 'failed'
        exceptionFormat 'full'
        showCauses true
        showStackTraces true
    }
}
