name: PR-CHECK

# main 으로 들어오기 전에 거르는 관문.
#
# 지금까지 검증은 배포 워크플로(main.yml)에만 있었고, 그건 deploy-* 브랜치 푸시에서만 돈다.
# 그래서 깨진 코드가 main 에 머지된 뒤 "배포하려는 순간"에야 드러났다.
# 2026-08-07 하루에 세 번 있었다:
#   - #209  getAiInsights·getAiReport 시그니처 변경, 테스트 호출부 누락 → 컴파일 실패
#   - #216  totalBudget·getBudgetStatus 시그니처 변경, 테스트 호출부 누락 → 컴파일 실패
#   - main.yml YAML 문법 오류 → 워크플로 런 자체가 생성되지 않음
#
# 셋 다 배포도 시크릿도 필요 없이, 파일만 보면 잡히는 것들이다.
on:
  pull_request:
    branches: [main]
  # deploy-* 에서 main 으로 되돌아오는 머지처럼 PR 을 거치지 않는 경로도 있어
  # main 푸시에서도 한 번 더 본다.
  push:
    branches: [main]

jobs:
  workflow-lint:
    name: 워크플로 문법 검사
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # 워크플로가 깨지면 워크플로는 스스로를 검사할 수 없다. GitHub 이 브랜치 필터조차
      # 읽지 못해 런이 0초 만에 죽고, 무엇이 잘못됐는지도 알려주지 않는다.
      # actionlint 는 파일만 읽으므로 그 상황에서도 원인을 짚어 준다.
      #
      # shellcheck·pyflakes 연동은 끈다. run: 블록의 셸 스타일까지 지적하기 시작하면
      # 기존 파일에서 잡음이 쏟아지고, 첫날부터 빨간 관문은 아무도 안 본다.
      # 여기서 막고 싶은 건 "파일이 파싱되는가"다.
      - name: actionlint
        run: |
          bash <(curl -s https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color -shellcheck= -pyflakes=

  build-test:
    name: 컴파일·테스트
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: gradlew 실행 권한
        run: chmod +x ./gradlew

      # 시그니처가 바뀌었는데 호출부가 안 따라오면 여기서 끝난다.
      # #209·#216 이 정확히 이 경우였다. 테스트를 돌리기도 전에 잡힌다.
      - name: 테스트 코드 컴파일
        run: ./gradlew compileTestJava --no-daemon

      # 실 DB·OpenAI 가 필요한 테스트는 -PciOnly 로 뺀다(build.gradle 참고).
      # contextLoads 는 남아 있어 빈 배선 오류도 함께 잡는다.
      - name: 테스트
        run: ./gradlew test -PciOnly --no-daemon
        env:
          # 이 관문이 보는 것은 "코드가 성립하는가" 하나다. 시크릿이 맞는지는 보지 않는다.
          # 값이 비어 있으면 JwtProvider 같은 생성자가 배선과 무관한 이유로 터지므로
          # 더미를 명시해 결과를 결정적으로 만든다. (main.yml 의 컨텍스트 로드 검증과 같은 이유)
          DB_URL: jdbc:mysql://127.0.0.1:3306/ci?connectTimeout=2000
          DB_USERNAME: ci
          DB_PASSWORD: ci
          # HS256 은 32바이트 이상을 요구한다. 짧으면 jjwt 가 거부한다.
          JWT_SECRET: ci-context-load-smoke-test-dummy-secret-key-0123456789
          GOOGLE_CLIENT_ID: ci-dummy
          GOOGLE_CLIENT_SECRET: ci-dummy
          NAVER_CLIENT_ID: ci-dummy
          NAVER_CLIENT_SECRET: ci-dummy
          KAKAO_CLIENT_ID: ci-dummy
          KAKAO_CLIENT_SECRET: ci-dummy
          CLIENT_URL: http://localhost:5173
          OPENAI_KEY: ci-dummy
          # gpt 로 둬야 GptInsight* 빈까지 생성돼 배선 검증 범위가 넓어진다(호출은 하지 않는다).
          INSIGHT_PROVIDER: gpt

      - name: 테스트 리포트 보존
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/reports/tests/test/
          retention-days: 7
