spring:
  profiles:
    # 프로필을 명시하지 않으면(로컬 실행·테스트) dev 로 동작한다.
    default: dev
    # secret 은 application-secret.yaml(gitignore) 의 실제 비밀값 문서.
    # dev/prod 어느 쪽으로 떠도 함께 활성화되어야 DB_URL·JWT_SECRET 등이 채워진다.
    group:
      dev: [dev, secret]
      prod: [prod, secret]
  application:
    name: feelio-api

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

    hikari:
      pool-name: HikariCP
      # 2026-08-13 로그인·카테고리가 통째로 막혔다. 원인은 풀 고갈이었다:
      #   HikariCP - Connection is not available, request timed out after 30000ms
      #   (total=5, active=5, idle=0, waiting=0)
      # 커넥션 5개가 전부 점유된 채 반납되지 않아, DB 를 쓰는 모든 요청이 30초 대기 후 실패했다.
      # 코드에서 커넥션을 직접 다루는 곳·스케줄러·트랜잭션 안 외부호출은 모두 없어 원인을 못 좁혔다.
      #
      # 5 는 느린 쿼리 다섯 개면 전체가 멈추는 값이라 10 으로 올린다.
      # 다만 이건 근본 해결이 아니라 버티는 시간을 벌어 아래 누수 감지 로그를 받아보기 위한 것이다.
      maximum-pool-size: 10
      minimum-idle: 3
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      # 커넥션을 20초 넘게 붙들면 그 시점의 스택트레이스를 WARN 으로 남긴다.
      # 멈춘 순간에 맞춰 SHOW PROCESSLIST 를 찍는 건 타이밍을 맞추기 어려워서,
      # 서버가 스스로 범인을 지목하게 한다. 정상 요청은 20초를 넘지 않으므로 평소엔 조용하다.
      leak-detection-threshold: 20000

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            authorization-grant-type: authorization_code
            client-name: Naver
            client-authentication-method: client_secret_post
            scope:
              - email
              - nickname
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            authorization-grant-type: authorization_code
            client-name: Kakao
            client-authentication-method: client_secret_post
            scope:
              - profile_nickname
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

jwt:
  issuer: korit
  secret: ${JWT_SECRET}
  accessTokenTtlSeconds: 3600       # 1h  (계약 §3 기준)
  refreshTokenTtlSeconds: 1209600   # 14d (계약 §3 기준)

# 아래 dev/prod 문서에서 덮어쓴다. 프로필 없이 떠도 값이 비지 않도록 기본값을 둔다.
client:
  url: http://localhost:5173

cookie:
  secure: false

server:
  port: 8080
  # nginx 등 리버스 프록시 뒤에서 동작할 때 X-Forwarded-* 헤더를 반영한다.
  # 없으면 OAuth {baseUrl} 이 내부 http 주소로 잡혀 redirect_uri_mismatch 가 난다.
  forward-headers-strategy: framework

---

spring:
  config:
    activate:
      on-profile: dev

client:
  url: http://localhost:5173

cookie:
  # 로컬은 http 라 secure 를 켜면 쿠키가 아예 안 붙는다.
  secure: false

---

spring:
  config:
    activate:
      on-profile: prod

client:
  url: ${CLIENT_URL}

cookie:
  # 운영은 https 이므로 반드시 켠다 (평문 http 로 토큰이 새는 것을 막는다).
  secure: true
---
openai:
  key: ${OPENAI_KEY}
  # 파인튜닝 모델은 ID 가 ft:gpt-4o-mini-...:org::xxxx 형태라 설정으로 뺀다.
  model: ${OPENAI_MODEL:gpt-4o-mini}
  # 계약 §1 상 프론트는 5초에 요청을 포기한다. 서버가 그보다 오래 기다리면
  # 애써 만든 규칙기반 폴백이 사용자에게 닿지 못하고 화면은 그냥 실패로 끝난다.
  # 20초로 두면 폴백이 있으나 마나였다 (#197).
  timeout-seconds: ${OPENAI_TIMEOUT_SECONDS:4}
  # 평행우주 서술만 따로 둔다. 한 번 호출로 문장 6개(2우주 × 3코멘트)를 받아
  # 앱에서 가장 출력이 큰 호출인데, 4초로는 대부분 타임아웃 나 규칙기반으로 떨어졌다.
  # 이 화면은 항해 연출이 있어 몇 초 더 기다릴 여지가 있다. 프론트도 이 요청만
  # 타임아웃을 늘려 잡는다(web src/api/universe.js).
  timeout-seconds-universe: ${OPENAI_TIMEOUT_SECONDS_UNIVERSE:10}

feelio:
  insight:
    # 인사이트 생성기. rule = 규칙기반(기본·호출 없음), gpt = OpenAI 호출.
    provider: ${INSIGHT_PROVIDER:gpt}
    # 이번 달 인사이트 재생성 주기(시간). 지난 달 이전은 이 값과 무관하게 영구 캐시된다.
    ttl-hours: ${INSIGHT_TTL_HOURS:6}
  ai:
    circuit:
      # 연속 실패가 이 횟수에 닿으면 서킷을 연다. 간헐적 실패로 열리지 않게 1은 피한다.
      failure-threshold: ${AI_CIRCUIT_FAILURE_THRESHOLD:3}
      # 서킷을 열어두는 시간. 이 동안은 호출하지 않고 곧바로 규칙기반으로 답한다.
      open-seconds: ${AI_CIRCUIT_OPEN_SECONDS:60}

firebase:
  key-path: classpath:firebase-key.json
